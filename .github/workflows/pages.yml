name: Website

# Command-only deployment of https://opencrude.github.io/.
# The site source lives in opencrude/crude under site/; this repository only
# publishes it. Pushes and other repository events never deploy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of opencrude/crude to publish
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opencrude/crude
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The site is published exactly as committed. The two installers keep
      # their canonical addresses at the site root.
      - name: Assemble the published directory
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp install.sh install.ps1 _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
