name: Website

# Command-only deployment of https://opencrude.github.io/.
# The site source lives in opencrude/crude under site/; this repository only
# publishes it. Pushes and other repository events never deploy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of opencrude/crude to publish
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opencrude/crude
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The site is published exactly as committed. linux.sh and windows.ps1
      # run the installer of the latest release. Released builds still tell
      # users to update with install.sh and install.ps1, so those names serve
      # the same two files.
      - name: Assemble the published directory
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp site/linux.sh _site/install.sh
          cp site/windows.ps1 _site/install.ps1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        id: upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
          retention-days: 1
      - name: Wait for the uploaded artifact to appear in the run
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_ARTIFACT: github-pages-${{ github.run_attempt }}
          PAGE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          path="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGE_ARTIFACT"
          for attempt in {1..20}; do
            visible=$(gh api "$path" --jq '.artifacts[] | select(.expired == false) | .id')
            [[ "$visible" != "$PAGE_ARTIFACT_ID" ]] || exit 0
            sleep 3
          done
          echo 'The uploaded Pages artifact did not appear in this run.' >&2
          exit 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
